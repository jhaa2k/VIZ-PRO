<script>
  // Filter out noisy errors from third-party browser extensions (e.g., MetaMask, wallet injectors)
  (function() {
    function isExtensionError(err, source) {
      var src = String(source || (err && (err.filename || err.stack)) || '');
      var msg = String((err && (err.message || err.reason)) || err || '');
      return (
        src.indexOf('chrome-extension://') !== -1 ||
        src.indexOf('moz-extension://') !== -1 ||
        src.indexOf('safari-web-extension://') !== -1 ||
        msg.indexOf('MetaMask') !== -1 ||
        msg.indexOf('ethereum') !== -1 ||
        msg.indexOf('Failed to connect to MetaMask') !== -1
      );
    }
    window.addEventListener('error', function(event) {
      if (isExtensionError(event.error || event, event.filename)) {
        event.preventDefault();
        event.stopImmediatePropagation();
        return true;
      }
    }, true);
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event.reason;
      if (isExtensionError(reason, reason && reason.stack)) {
        event.preventDefault();
        event.stopImmediatePropagation();
        return true;
      }
    }, true);
  })();

  if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
